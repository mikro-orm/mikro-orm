name: docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    environment:
      name: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for the last update time
      # corepack must be enabled before setup-node so its yarn cache step can find yarn
      - name: Enable corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          token: ${{ secrets.GH_TOKEN }}
          cache: yarn

      - name: Install
        run: yarn

      - name: Set git identity
        run: |
          git config --global user.name "Martin Adámek"
          git config --global user.email "banan23@gmail.com"

      - name: Build docs
        run: |
          cd docs
          yarn
          yarn build

      - name: Set up GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/build

      - name: Deploy artifact to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
